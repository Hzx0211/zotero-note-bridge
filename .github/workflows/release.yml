name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm audit --audit-level=high
      - name: Require tag and manifest versions to match
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(node -p "require('./manifest.json').version")" = "$GITHUB_REF_NAME"
          test "$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          name: Zotero Note Bridge ${{ github.ref_name }}
          files: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
